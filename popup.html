<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Zenith</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="brand">
      <div class="brand-title">
        <span class="logo">♞</span>
        <div>
          <h1 id="app-name">Zenith</h1>
          <p class="subtitle">Peak performance coach · <span id="site-label">chess.com</span></p>
        </div>
      </div>
    </header>

    <div class="row card-none">
      <span class="row-label">Assistant</span>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <div class="card-title">Side</div>
      <div class="seg">
        <label><input type="radio" name="userColor" value="auto" checked /><span>Auto</span></label>
        <label><input type="radio" name="userColor" value="w" /><span>White</span></label>
        <label><input type="radio" name="userColor" value="b" /><span>Black</span></label>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Coach</div>
      <div class="field">
        <span>Difficulty</span>
        <select id="difficulty">
          <option value="600">600 · Casual</option>
          <option value="1200">1200 · Club</option>
          <option value="1800">1800 · Strong</option>
          <option value="2000">2000 · 2000</option>
          <option value="2500">2500 · Expert</option>
          <option value="3000">3000 · Legendary</option>
        </select>
      </div>
      <div class="field">
        <span>Alternatives</span>
        <select id="multipv">
          <option value="1">1 · Best only</option>
          <option value="2">2 · Best + runner-up</option>
          <option value="3">3 · Three</option>
        </select>
      </div>
    </div>

    <div class="row card-none">
      <span class="row-label">Threats</span>
      <label class="switch">
        <input type="checkbox" id="showThreat" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="card">
      <div class="card-title">License</div>
      <div class="field">
        <span>Status</span>
        <span id="license-tier" class="license-tier">Checking…</span>
      </div>
      <div class="btn-row">
        <button id="license-activate" type="button" class="primary" hidden>Activate Zenith</button>
      </div>
      <p class="hint" id="license-hint"></p>
    </div>

    <div class="modal-overlay" id="license-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <button class="modal-close" id="modal-close" type="button" aria-label="Close">&times;</button>
        <h2>Activate Zenith</h2>
        <p class="modal-sub">Unlock the full coach.</p>
        <div class="modal-buttons" id="modal-buttons">
          <button id="modal-paid" type="button" class="primary">I bought a key</button>
          <button id="modal-free" type="button" class="secondary">Get a free pass</button>
        </div>
        <div class="modal-keywrap" id="modal-keywrap" hidden>
          <input type="text" id="license-key" placeholder="Gumroad license key" autocomplete="off" spellcheck="false" />
          <button id="license-confirm" type="button" class="primary">Unlock</button>
        </div>
        <p class="hint" id="modal-hint"></p>
      </div>
    </div>

    <div id="status" class="status">Ready</div>
    <footer class="foot">chess.com · lichess.org &nbsp;·&nbsp; <span class="local">100% local</span></footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
